<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobriy Win Game</title>
    <!-- Подключаем Telegram WebApp скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .balance {
            font-weight: bold;
            color: #34d399;
        }
        .btn-play {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>dobriy<strong>win</strong></span>
        <span class="balance" id="balance-display">Загрузка...</span>
    </div>

    <h2>Игра: Сапер / Кристаллы</h2>
    <p>Ставка: <span id="current-bet">0.5</span> USDT</p>

    <button class="btn-play" onclick="playGame()">ИГРАТЬ (-0.5 USDT)</button>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Получаем Telegram ID пользователя
        const userId = tg.initDataUnsafe?.user?.id || 123456789; // Заглушка для теста в браузере

        // Функция запроса баланса с сервера
        async function fetchBalance() {
            try {
                let response = await fetch('/api/get_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                let data = await response.json();
                if (data.success) {
                    document.getElementById('balance-display').innerText = data.balance.toFixed(2) + " USDT";
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса:", e);
                document.getElementById('balance-display').innerText = "1.50 USDT"; // Фоллбек
            }
        }

        // Функция изменения баланса при игре (ставка / выигрыш / проигрыш)
        async function updateBalanceOnServer(amountChange) {
            try {
                let response = await fetch('/api/update_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, amount: amountChange })
                });
                let data = await response.json();
                if (data.success) {
                    document.getElementById('balance-display').innerText = data.balance.toFixed(2) + " USDT";
                }
            } catch (e) {
                console.error("Ошибка отправки результатов игры:", e);
            }
        }

        // Пример логики игры при нажатии кнопки "ИГРАТЬ"
        async function playGame() {
            let bet = 0.5;
            // Сначала списываем ставку
            await updateBalanceOnServer(-bet);

            // Имитация игры (например, с вероятностью 50% выигрыш или проигрыш)
            let isWin = Math.random() >= 0.5;

            if (isWin) {
                let winAmount = bet * 1.4; // Выигрыш с коэффициентом 1.4x
                alert("Поздравляем! Вы выиграли " + winAmount.toFixed(2) + " USDT");
                await updateBalanceOnServer(winAmount);
            } else {
                alert("К сожалению, вы проиграли ставку " + bet + " USDT");
                // Ставка уже списалась в самом начале, дополнительно ничего не отнимаем
            }
        }

        // Загружаем баланс при открытии мини-приложения
        fetchBalance();
    </script>
</body>
</html>
