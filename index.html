<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DobriyWin Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151c2c;
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid #1f293d;
        }
        .balance { font-weight: bold; color: #10b981; font-size: 16px; }
        .wallet-actions { display: flex; gap: 6px; margin-bottom: 12px; }
        .w-btn {
            flex: 1; padding: 10px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; color: white;
        }
        .btn-dep { background: #2563eb; }
        .btn-wit { background: #7c3aed; }

        /* Меню выбора игр */
        .game-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .game-tab {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .game-tab.active { background: #3b82f6; color: white; border-color: #60a5fa; }
        .game-tab.soon { opacity: 0.6; border-style: dashed; }

        .game-container {
            background: #151c2c;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .panel { display: none; }
        .panel.active { display: block; }

        input, select {
            width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 15px;
        }
        label { font-size: 13px; color: #94a3b8; display: block; text-align: left; }
        
        .action-btn {
            background: #10b981; color: white; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; margin-top: 5px;
        }
        
        /* Сетка мин */
        .mines-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 280px; margin: 10px auto;
        }
        .m-cell {
            aspect-ratio: 1; background: #1e293b; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer;
        }
        .m-cell.gem { background: #059669; }
        .m-cell.mine { background: #dc2626; }

        /* Стили для апгрейдера (в стиле CaseHug) */
        .upgrader-wheel {
            position: relative; width: 180px; height: 180px; margin: 15px auto; border-radius: 50%; background: conic-gradient(#10b981 0deg, #f59e0b 200deg, #dc2626 360deg); display: flex; align-items: center; justify-content: center;
        }
        .upgrader-inner {
            width: 140px; height: 140px; background: #0f172a; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>Dobriy<strong>Win</strong></span>
        <span class="balance" id="balance-txt">0.00 USDT</span>
    </div>

    <div class="wallet-actions">
        <button class="w-btn btn-dep" onclick="topUpBot()">💳 Пополнить в боте</button>
        <button class="w-btn btn-wit" onclick="withdrawBot()">📤 Вывести</button>
    </div>

    <!-- Навигация по играм -->
    <div class="game-nav">
        <div class="game-tab active" onclick="switchGame('coinflip')">🪙 Орел / Решка</div>
        <div class="game-tab" onclick="switchGame('mines')">💣 Мины 4x4</div>
        <div class="game-tab" onclick="switchGame('upgrader')">⚡ Апгрейдер</div>
        <div class="game-tab soon" onclick="alert('Игра находится в разработке!')">🚀 Краш (Скоро)</div>
        <div class="game-tab soon" onclick="alert('Игра находится в разработке!')">📦 Кейсы (Скоро)</div>
    </div>

    <!-- 1. Орел и Решка -->
    <div id="game-coinflip" class="game-container panel active">
        <h3>Орел и Решка (Шанс 20%)</h3>
        <label>Сумма ставки (USDT):</label>
        <input type="number" id="cf-bet" value="1.0" min="0.1" step="0.1">
        
        <label>Выберите сторону:</label>
        <select id="cf-choice">
            <option value="heads">Орел 🦅</option>
            <option value="tails">Решка 🪙</option>
        </select>
        
        <button class="action-btn" onclick="playCoinflip()">СДЕЛАТЬ СТАВКУ</button>
        <p id="cf-result" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- 2. Мины 4x4 -->
    <div id="game-mines" class="game-container panel">
        <h3>Мины 4x4</h3>
        <label>Ставка:</label>
        <input type="number" id="m-bet" value="1.0" min="0.1" step="0.1">
        
        <label>Количество мин:</label>
        <select id="m-count">
            <option value="3">3 мины (Плавный рост)</option>
            <option value="5">5 мин (Средний риск)</option>
            <option value="10">10 мин (Хардкор)</option>
        </select>

        <button class="action-btn" id="m-start-btn" onclick="startMinesGame()">НАЧАТЬ ИГРУ</button>
        
        <div class="mines-grid" id="mines-board"></div>
        <button class="action-btn" id="m-cashout" style="display:none; background:#f59e0b;" onclick="cashOutMines()">ЗАБРАТЬ</button>
    </div>

    <!-- 3. Апгрейдер -->
    <div id="game-upgrader" class="game-container panel">
        <h3>Апгрейдер баланса</h3>
        <label>Сумма ставки (USDT):</label>
        <input type="number" id="up-bet" value="2.0" min="0.1" step="0.1">

        <label>Желаемый шанс победы (%):</label>
        <input type="range" id="up-chance" min="10" max="90" value="50" oninput="document.getElementById('chance-val').innerText = this.value">
        <span id="chance-val" style="color:#f59e0b; font-weight:bold;">50</span>% 
        <span style="font-size:11px; color:#64748b; display:block; margin-top:2px;">(Платформа контролирует математику в свою пользу)</span>

        <div class="upgrader-wheel">
            <div class="upgrader-inner">
                <span style="font-size: 12px; color: #94a3b8;">УСПЕХ</span>
                <span id="up-mult-text" style="font-size: 18px; color: #10b981;">x1.9x</span>
            </div>
        </div>

        <button class="action-btn" onclick="playUpgrader()">УЛУЧШИТЬ БАЛАНС</button>
        <p id="up-result" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const userId = tg.initDataUnsafe?.user?.id || 123456789;

        async function fetchBalance() {
            try {
                let res = await fetch('/api/get_balance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                let data = await res.json();
                if(data.success) {
                    document.getElementById('balance-txt').innerText = data.balance.toFixed(2) + " USDT";
                }
            } catch(e) { console.error(e); }
        }

        function switchGame(gameName) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            
            if(gameName === 'coinflip') {
                document.getElementById('game-coinflip').classList.add('active');
            } else if(gameName === 'mines') {
                document.getElementById('game-mines').classList.add('active');
            } else if(gameName === 'upgrader') {
                document.getElementById('game-upgrader').classList.add('active');
            }
            event.target.classList.add('active');
        }

        async function playCoinflip() {
            let bet = parseFloat(document.getElementById('cf-bet').value);
            let choice = document.getElementById('cf-choice').value;

            let res = await fetch('/api/game/coinflip', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, bet: bet, choice: choice})
            });
            let data = await res.json();
            if(data.success) {
                fetchBalance();
                let txt = data.win ? `🎉 Победа! Выпало: ${data.result_side}. Выигрыш: +${data.win_amount.toFixed(2)} USDT` : `❌ Проигрыш! Выпало: ${data.result_side}.`;
                document.getElementById('cf-result').innerText = txt;
                document.getElementById('cf-result').style.color = data.win ? '#10b981' : '#dc2626';
            } else { alert(data.error); }
        }

        async function playUpgrader() {
            let bet = parseFloat(document.getElementById('up-bet').value);
            let chance = parseFloat(document.getElementById('up-chance').value);

            let res = await fetch('/api/game/upgrader', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, bet: bet, chance: chance})
            });
            let data = await res.json();
            if(data.success) {
                fetchBalance();
                let txt = data.win ? `🎉 Успех! Рулетка выпала на ${data.roll}%. Выигрыш: +${data.win_amount.toFixed(2)} USDT` : `❌ Неудача! Рулетка выпала на ${data.roll}% (шанс был ${data.chance_used}%).`;
                document.getElementById('up-result').innerText = txt;
                document.getElementById('up-result').style.color = data.win ? '#10b981' : '#dc2626';
            } else { alert(data.error); }
        }

        let minesActive = false;
        let mineList = [];
        let revealedMinesCount = 0;
        let currentMinesBet = 1;
        let totalMinesCount = 3;

        function startMinesGame() {
            currentMinesBet = parseFloat(document.getElementById('m-bet').value);
            totalMinesCount = parseInt(document.getElementById('m-count').value);
            
            // Списываем ставку через бэкенд
            fetch('/api/update_balance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, amount: -currentMinesBet})
            }).then(r => r.json()).then(d => {
                if(d.success) {
                    fetchBalance();
                    minesActive = true;
                    revealedMinesCount = 0;
                    document.getElementById('m-start-btn').disabled = true;
                    document.getElementById('m-cashout').style.display = 'block';
                    
                    mineList = [];
                    while(mineList.length < totalMinesCount) {
                        let r = Math.floor(Math.random() * 16);
                        if(!mineList.includes(r)) mineList.push(r);
                    }
                    renderMinesBoard();
                }
            });
        }

        function renderMinesBoard() {
            let board = document.getElementById('mines-board');
            board.innerHTML = '';
            for(let i=0; i<16; i++) {
                let cell = document.createElement('div');
                cell.className = 'm-cell';
                cell.dataset.idx = i;
                cell.onclick = () => clickMineCell(i);
                board.appendChild(cell);
            }
        }

        function clickMineCell(idx) {
            if(!minesActive) return;
            let cell = document.querySelector(`[data-idx='${idx}']`);
            if(cell.classList.contains('gem') || cell.classList.contains('mine')) return;

            // Жесткая проверка: 80% шанс на попадание в мину при клике, если игрок слишком долго играет
            if(mineList.includes(idx) || Math.random() < 0.4) {
                cell.className = 'm-cell mine';
                cell.innerText = '💣';
                alert("💥 Вы подорвались на мине!");
                endMines(false);
            } else {
                cell.className = 'm-cell gem';
                cell.innerText = '💎';
                revealedMinesCount++;
                if(revealedMinesCount >= (16 - totalMinesCount)) {
                    cashOutMines();
                }
            }
        }

        async function cashOutMines() {
            if(!minesActive) return;
            let win = currentMinesBet * (1.3 * revealedMinesCount);
            await fetch('/api/update_balance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, amount: win})
            });
            alert(`🎉 Победа! Вы забрали: ${win.toFixed(2)} USDT`);
            fetchBalance();
            endMines(true);
        }

        function endMines(isWin) {
            minesActive = false;
            document.getElementById('m-start-btn').disabled = false;
            document.getElementById('m-cashout').style.display = 'none';
        }

        fetchBalance();
    </script>
</body>
</html>
